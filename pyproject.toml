[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "steam-achievement-unlocker-offline"
version = "0.4.2"
description = "Offline Steam achievement unlocker for Windows — edits local UserGameStats and appcache/stats without touching Valve services."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "sau maintainers" }]
keywords = ["steam", "achievements", "offline", "unlocker", "modding", "windows"]
classifiers = [
  "Environment :: Win32 (MS Windows)",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Games/Entertainment",
  "Topic :: Utilities",
]
dependencies = [
  "typer>=0.12",
  "rich>=13.7",
  "platformdirs>=4.2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "mypy>=1.10",
]

[project.scripts]
sau = "sau.bootstrap.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/sau"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/sau/core", "src/sau/models"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=sau --cov-report=term-missing"